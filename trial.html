<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Companion - User Profile</title>
    <link rel="stylesheet" href="trials.css">
</head>
<body>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h2>HOME</h2>
            <button class="side-btn">CONTACT</button>
            <button class="side-btn">CHAT</button>
            <button class="side-btn">LOCATION SHARING</button>
            <button class="side-btn">EMERGENCY SPEED DIAL</button>
            <button class="side-btn">MEDICAL REPORTS</button>
        </div>

        <!-- Main Content -->
        <div class="profile-section">
            <div class="header">
                <h1>SMART COMPANION APP</h1>
            </div>

            <div class="profile-card">
                <h3>PATIENT DETAILS</h3>
                <div class="profile-content">
                    <img src="static/user.jpg" alt="Profile Picture" class="profile-img">
                    <div class="profile-details">
                        <p><strong>Name:</strong> Abu Bin Ali</p>
                        <p><strong>Age:</strong> 62</p>
                        <p><strong>Gender:</strong> Male</p>
                        <p><strong>Emergency Contact:</strong> 0167459771 (Son)</p>
                    </div>
                </div>
                
                <div class="buttons">
                    <button class="edit-btn">EDIT DETAILS</button>
                    <button class="remove-btn">REMOVE ACCOUNT</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
