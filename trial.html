<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts - Smart Companion App</title>
    <link rel="stylesheet" href="trials.css">
</head>
<body>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <a href="{{ url_for('user') }}"><h2>HOME</h2></a>
            <button class="nav-btn">CONTACT</button>
            <button class="nav-btn">CHAT</button>
            <button class="nav-btn">LOCATION SHARING</button>
            <button class="nav-btn">EMERGENCY SPEED DIAL</button>
            <button class="nav-btn">MEDICAL REPORTS</button>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="header">
                <h1>SMART COMPANION APP</h1>
                <div class="user-profile">
                    <span>ROXANNE</span>
                    <img src="user-icon.png" alt="User Profile">
                </div>
            </div>

            <!-- Contacts Section -->
            <div class="contacts-section">
                <h2 class="contacts-title">CONTACTS</h2>
                <table class="contacts-table">
                    <tr>
                        <th>No.</th>
                        <th>Name</th>
                        <th>Contact Number</th>
                    </tr>
                    <tr>
                        <td>1</td>
                        <td>Abu</td>
                        <td>012-8854509</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Jayan</td>
                        <td>011-4430589</td>
                    </tr>
                </table>
            </div>

            <!-- Buttons -->
            <div class="buttons">
                <button class="back-btn">BACK</button>
                <button class="add-btn">ADD CONTACTS</button>
            </div>
        </div>
    </div>

</body>
</html>
