<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Companion - User Profile</title>
    <link rel="stylesheet" href="static/profile.css">
</head>
<body>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <a href="{{ url_for('superadmin') }}"><h2>HOME</h2></a>
            <a href="{{ url_for('adminmanage') }}"><button class="nav-btn">MANAGE ADMIN</button></a>
            <a href="{{ url_for('systemsight') }}"><button class="nav-btn">SYSTEM DATA OVERSIGHT</button></a>
        </div>
    
    

        <!-- Main Content -->
        <div class="profile-section">
            <div class="header">
                <h1>SMART COMPANION APP</h1>
            </div>

            <div class="profile-card">
                <h3>SUPER ADMIN DETAILS</h3>
                 <div class="profile-content">
                    <img src="{{ image_url }}" alt="Profile Picture" class="profile-img">
                    <div class="profile-details">
                        <p><strong>Username:</strong> {{ admin['username'] }}</p>
                        <p>
                            <strong>Password:</strong> 
                            <span id="password" data-password="{{ admin['password'] }}"  type="password">*******</span>
                            <button onclick="togglePassword()">Show</button>
                        </p>
                    </div>
                    <script src="static/js/edituser.js"></script>
                </div>
                
                <div class="buttons">
                    <button class="edit-btn" onclick="openPopup()">EDIT DETAILS</button>

                    <!-- The pop-up container -->
                    <div id="popup" class="popup-container">
                        <div class="popup-content">
                            <span class="close-btn" onclick="closePopup()">&times;</span>
                            <h2>Edit Super Admin</h2>
                          <!-- form -->
                            <form method="POST" enctype="multipart/form-data" action="/editsuadmin">
                                <input type="file" name="image" id="image" accept="image/*">
                                                      
                                <!-- File Input for Image Upload -->
                                <input type="file" id="file-input" name="image" accept="image/*" style="display: none;" onchange="previewImage(event)">
                                
                                <!-- Display selected image -->
                                <div id="image-preview" style="margin-top: 10px;"></div>
                                    <div><p>Username:</p><input type="text" id="username" name="username"></div>
                                    <div><p>Password:</p><input type="text" id="password" name="password"></div>
                                    <button class="save-btn" onclick="closePopup()" type="submit">SAVE CHANGES</button>
                            </form>
                        </div>
                    </div>
                    <!-- Script to preview image -->
                    <script>
                        function previewImage(event) {
                            var reader = new FileReader();
                            reader.onload = function(){
                                var output = document.createElement('img');
                                output.src = reader.result;
                                output.style.width = '100px';  // Set image preview size
                                document.getElementById('image-preview').innerHTML = '';
                                document.getElementById('image-preview').appendChild(output);
                            }
                            reader.readAsDataURL(event.target.files[0]);
                        }
                    </script>
                    <script src="static/js/edituser.js"></script>

                    
                    <button class="remove-btn"  onclick="OpenPopup()">REMOVE ACCOUNT</button>
                        <div id="pop-up" class="popup-container">
                            <div class="popup-content">
                                <form method="POST" action="/removesuadmin">
                                    <span class="close-btn" onclick="ClosePopup()">&times;</span>
                                        <h2>Remove Account</h2>
                                        <h3>Are you sure you want to remove your account?</h3>
                                        <button onclick="ClosePopup()" type="button">NO</button>
                                        <button onclick="ClosePopup()" type="submit">YES</button>
                                </form>
                            </div>
                        </div>
                        <script src="static/js/edituser.js"></script>

                    <a href="{{ url_for('logout') }}">LOGOUT</a>
                    
                </div>
            </div>
        </div>

    </div>

</body>
</html>
