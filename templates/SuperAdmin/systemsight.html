<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Data Oversight</title>
    <link rel="stylesheet" href="static/contact.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <a href="{{ url_for('superadmin') }}"><h2>HOME</h2></a>
            <a href="{{ url_for('adminmanage') }}"><button class="nav-btn">MANAGE ADMIN</button></a>
            <a href="{{ url_for('systemsight') }}"><button class="nav-btn">SYSTEM DATA OVERSIGHT</button></a>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="header">
                <h1>SMART COMPANION APP</h1>
                <div class="user-profile">
                    <a href="{{ url_for('su_profile') }}">
                        <img src="{{ image_url }}" alt="Profile Picture" class="profile-img">
                    </a>
                </div>
            </div>

            <!-- System Data Oversight Section -->
            <div class="contacts-section">
                <h2 class="contacts-title">SYSTEM DATA OVERSIGHT</h2>

                <table class="contacts-table">
                    <thead>
                        <tr>
                            <th>Category</th>
                            <th>Total Count</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Total no. of Elderly (users)</td>
                            <td>{{ user_count }}</td>
                        </tr>
                        <tr>
                            <td>Total no. of Caretakers</td>
                            <td>{{ caretaker_count }}</td>
                        </tr>
                        <tr>
                            <td>Total no. of Admins</td>
                            <td>{{ admin_count }}</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Back Button -->
            <div class="buttons">
                <a href="{{ url_for('superadmin') }}"><button class="back-btn">BACK</button></a>
            </div>
        </div>
    </div>

</body>
</html>
