<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <link rel="stylesheet" type="text/css" href="static/style.css">
        <link rel="icon" type="image/x-icon" href="static/favicon.ico">
    </head>
    <body>
        <h1>Login</h1>
        <p>You can Login here!</p>
        <!-- Over here they can login as USER, CARETAKER, ADMIN, SUPERADMIN-->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul>
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
        <form action="/login" method="POST">
            <label for="username">Enter Username:</label>
            <input type="text" id="username" name="username" required><br><br>

            <label for="password">Enter Password</label>
            <input type="password" id="password" name="password" required><br><br>

            <input type="submit" value="Sign in">
        </form>
        <script>
            (function() {
                // Push new history state to block back navigation
                window.history.pushState(null, "", window.location.href);
        
                window.onpopstate = function() {
                    // If user presses back, redirect to login and clear session
                    alert("You cannot go back after logging out!");
                    window.location.href = "/login";
                };
        
                // Extra layer: Reload page on back to ensure logout state
                if (window.performance && window.performance.navigation.type === 2) {
                    window.location.href = "/login";
                }
            })();
        </script>
    </body>
</html>
