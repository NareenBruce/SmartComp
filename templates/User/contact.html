<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts - Smart Companion App</title>
    <link rel="stylesheet" href="static/contact.css">
</head>
<body>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <a href="{{ url_for('user') }}"><h2>HOME</h2></a>
            <button class="nav-btn">CONTACT</button>
            <button class="nav-btn">CHAT</button>
            <button class="nav-btn">LOCATION SHARING</button>
            <button class="nav-btn">EMERGENCY SPEED DIAL</button>
            <button class="nav-btn">MEDICAL REPORTS</button>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="header">
                <h1>SMART COMPANION APP</h1>
                <div class="user-profile">
                    <img src="{{ image_url }}" alt="Profile Picture" class="profile-img">
                </div>
            </div>

            <!-- Contacts Section -->
            <div class="contacts-section">
                <h2 class="contacts-title">CONTACTS</h2>
                <table class="contacts-table">
                    <tr>
                        <th>No.</th>
                        <th>Name</th>
                        <th>Contact Number</th>
                    </tr>
                    {% for contact in contacts %}
                    <tr>
                        <td>{{ contact[0] }}</td>
                        <td>{{ contact[1] }}</td>
                        <td><a href="tel:+6{{ contact[2] }}" onclick="event.stopPropagation();">{{ contact[2] }}</a></td>
                    </tr>
                    {% endfor %}
                </table>
            </div>

            <!-- Buttons -->
            <div class="buttons">
                <button class="back-btn">BACK</button>
                
                <button class="add-btn" onclick="opencontact()">ADD CONTACTS</button>
                <div id="pop-contact" class="popup-container">
                    <div class="popup-content">
                        <span class="close-btn" onclick="closecontact()">&times;</span>
                            <h2>Add Contact</h2>
                            <form method="POST" action="addcontact">
                                <input type="text" name="name" placeholder="Name" required>
                                <input type="text" name="contact_number" placeholder="Contact Number" required>
                                <button type="submit" class="add-btn" onclick="closecontact()">ADD</button>
                            </form>
                            <script src="static/js/edituser.js"></script>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
