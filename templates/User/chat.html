<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts - Smart Companion App</title>
    <link rel="stylesheet" href="static/contact.css">
</head>
<body>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <a href="{{ url_for('user') }}"><h2>HOME</h2></a>
            <button class="nav-btn"><a href="{{ url_for('contactuser') }}">CONTACT</a></button>
            <button class="nav-btn"><a href="{{ url_for('chatuser') }}">CHAT</a></button>
            <button class="nav-btn"><a href="{{ url_for('locationuser') }}">LOCATION SHARING</a></button>
            <button class="nav-btn"><a href="{{ url_for('emergencyuser') }}">EMERGENCY SPEED DIAL</a></button>
            <button class="nav-btn"><a href="{{ url_for('medicaluser') }}">MEDICAL REPORTS</a></button>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="header">
                <h1>SMART COMPANION APP</h1>
                <div class="user-profile">
                    <img src="{{ image_url }}" alt="Profile Picture" class="profile-img">
                </div>
            </div>

            <!-- Contacts Section -->
            <div class="contacts-section">
                <h2 class="contacts-title">CHAT</h2>
                <table class="contacts-table">
                    <tr>
                        <th>Name</th>
                        <th>Contact Number</th>
                        <th>Chat</th>
                    </tr>
                    {% for contact in contacts %}
                    <tr>
                        <td>{{ contact[1] }}</td>
                        <td>{{ contact[2] }}</td>
                        <td>
                            <a href="{{ url_for('chatuser', contact=contact[2]) }}" target="_blank">
                                <button type="button">Chat</button>
                            </a>
                        </td>
                    
                    </tr>
                    {% endfor %}
                </table>
            </div>

            <!-- Buttons -->
            <div class="buttons">
                <button class="back-btn" ><a href="{{ url_for('user') }}">BACK</a></button>
            </div>
        </div>
    </div>

</body>
</html>
